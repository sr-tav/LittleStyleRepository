# Despliegue base (US-13): backend + web. Producción en EC2 usa este archivo con RDS y S3.
#   docker compose up -d --build
# Local con MySQL en contenedor: ver docker-compose.local.yml
# El nombre fijo hace que Jenkins (deploy/jenkins) administre estos mismos contenedores.
name: littlestyle

services:
  backend:
    build: .
    image: littlestyle-backend
    restart: unless-stopped
    env_file: ${LITTLESTYLE_ENV_FILE:-.env}
    # Con Jenkins en la misma máquina; la JVM toma el 75 % de este límite
    mem_limit: 1g
    expose:
      - "8080"
    volumes:
      - uploads:/app/data/uploads

  web:
    build: ./frontend
    image: littlestyle-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  uploads:
  caddy_data:
  caddy_config:
