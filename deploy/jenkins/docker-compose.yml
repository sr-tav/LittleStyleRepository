# Jenkins (US-13). Se levanta después del stack de la app porque comparte su red con Caddy:
#   cd deploy/jenkins && cp .env.example .env && nano .env && docker compose up -d --build
# Queda publicado por Caddy en https://<dominio>/jenkins
name: jenkins

services:
  jenkins:
    build: .
    image: littlestyle-jenkins
    container_name: jenkins
    restart: unless-stopped
    env_file: .env
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx512m
      # El pipeline despliega con estos archivos de la app (ver Jenkinsfile)
      LITTLESTYLE_ENV_FILE: /deploy/.env
      COMPOSE_FILE: ${LITTLESTYLE_COMPOSE_FILE:-docker-compose.yml}
    # Permiso sobre el socket de Docker del host (gid del grupo docker)
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../.env:/deploy/.env:ro

volumes:
  jenkins_home:

networks:
  default:
    name: littlestyle_default
    external: true
