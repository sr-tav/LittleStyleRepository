spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/littlestyle?sslMode=REQUIRED&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Obligatoria en producción, sin clave predeterminada.
app.crypto.perfil-key=${PERFIL_ENC_KEY}
app.perfiles.max=${PERFILES_MAX:10}
# Imágenes del catálogo en S3; credenciales por rol IAM o variables estándar de AWS (nunca en el código)
app.storage.tipo=s3
app.storage.s3.bucket=${AWS_S3_BUCKET}
