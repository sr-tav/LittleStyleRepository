# Perfil para desarrollo local sin MySQL: H2 en archivo (los datos sobreviven reinicios)
# Ejecutar con: mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/littlestyle-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.perfiles.cifrado.migrar-datos=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clave pública de desarrollo; reemplazarla fuera de entornos locales.
app.crypto.perfil-key=${PERFIL_ENC_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.perfiles.max=${PERFILES_MAX:10}

# Administrador inicial (los administradores no pueden auto-registrarse)
app.admin.email=admin@littlestyle.com
app.admin.password=Admin12345
