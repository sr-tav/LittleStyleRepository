spring.application.name=LittleStyle
spring.profiles.active=dev
server.port=8080

spring.jpa.open-in-view=false

# --- Seguridad / JWT ---
# En dev/local se usa una clave por defecto; en prod JWT_SECRET es obligatorio (ver application-prod.properties)
app.jwt.secret=${JWT_SECRET:fU4vAmqXuCYrZrEa0nxgNLpBz4s7E2/RIQ8Nr9UfuaVrh1FKIYse12XhkKu4MylNoNFQnI0ZsrhyTuNfBEcexQ==}
# 8 horas
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
# Límite de intentos fallidos de login por correo + IP antes de bloquear temporalmente
app.security.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
app.security.login.ventana-minutos=${LOGIN_VENTANA_MINUTOS:15}
app.security.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Solo para desarrollo local; en producción debe definirse PERFIL_ENC_KEY.
app.crypto.perfil-key=${PERFIL_ENC_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.perfiles.max=${PERFILES_MAX:10}

app.recomendacion.vigencia-medidas-meses=6
app.recomendacion.max-resultados=24
# Estrategia de talla configurable (ADR-12: EXACTA, PROXIMIDAD, HOLGURA).
# Vacía usa el bean @Primary (HOLGURA). La marca manda sobre la categoría.
# Ejemplos:
# app.recomendacion.estrategia-por-defecto=HOLGURA
# app.recomendacion.estrategia-por-categoria.VESTIDOS=PROXIMIDAD
# app.recomendacion.estrategia-por-marca.TIENDA-SOL=EXACTA
app.checkout.costo-envio-armenia=${CHECKOUT_COSTO_ENVIO_ARMENIA:7000}
app.checkout.costo-envio-quindio=${CHECKOUT_COSTO_ENVIO_QUINDIO:10000}
app.checkout.costo-envio-otras-ciudades=${CHECKOUT_COSTO_ENVIO_OTRAS_CIUDADES:15000}
app.checkout.tiempo-expiracion-pedido=${CHECKOUT_TIEMPO_EXPIRACION_PEDIDO:PT30M}
app.checkout.municipios-quindio=${CHECKOUT_MUNICIPIOS_QUINDIO:CALARCA,CIRCASIA,CORDOBA,FILANDIA,GENOVA,LA TEBAIDA,MONTENEGRO,PIJAO,QUIMBAYA,SALENTO,BUENAVISTA}

# --- Correo transaccional Gmail SMTP (US-12, ADR-07) ---
# En Gmail la clave es una contraseña de aplicación (con verificación en 2 pasos).
# Nunca se versionan: definir como variables de entorno. Sin usuario o clave no se envía.
app.correo.host=${MAIL_HOST:smtp.gmail.com}
app.correo.puerto=${MAIL_PORT:587}
app.correo.usuario=${MAIL_USER:}
app.correo.clave=${MAIL_PASS:}
# Timeout SMTP y reintentos de envío (RNF-23, ADR-14)
app.correo.timeout-ms=${MAIL_TIMEOUT_MS:10000}
app.correo.reintentos=${MAIL_REINTENTOS:3}
app.correo.espera-reintento-ms=${MAIL_ESPERA_REINTENTO_MS:2000}

# --- Pasarela de pagos Wompi (US-11) ---
# Llaves del panel de comercios Wompi (Desarrolladores). Nunca se versionan: definir como variables de entorno.
# Sandbox: https://sandbox.wompi.co/v1 | Producción: https://production.wompi.co/v1
app.wompi.api-url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
app.wompi.llave-publica=${WOMPI_PUBLIC_KEY:}
app.wompi.secreto-integridad=${WOMPI_INTEGRITY_SECRET:}
app.wompi.secreto-eventos=${WOMPI_EVENTS_SECRET:}
# Opcional y solo con dominio publico (Wompi responde 403 a redirect-url con localhost); en local se omite
app.wompi.url-redireccion=${WOMPI_REDIRECT_URL:}
app.wompi.moneda=COP
# Limites de pago (RNF-07, RNF-21, RNF-28): vigencia de los avisos del webhook, tiempos maximos
# de espera a la API de Wompi, intentos por pedido y procesamiento en segundo plano de eventos
app.pagos.vigencia-evento=${PAGOS_VIGENCIA_EVENTO:PT10M}
app.pagos.tolerancia-reloj=PT1M
app.pagos.timeout-conexion=${PAGOS_TIMEOUT_CONEXION:PT3S}
app.pagos.timeout-lectura=${PAGOS_TIMEOUT_LECTURA:PT8S}
app.pagos.max-intentos-por-pedido=${PAGOS_MAX_INTENTOS:5}
app.pagos.eventos-asincronos=true
app.pagos.hilos-eventos=4
app.pagos.cola-eventos=100

# --- Catálogo e inventario (US-08) ---
# Almacenamiento de imágenes: local (disco, servido en /media/**) o s3 (ADR-10)
app.storage.tipo=${STORAGE_TIPO:local}
app.storage.local.directorio=${STORAGE_LOCAL_DIR:./data/uploads}
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.url-publica-base=${AWS_S3_URL_PUBLICA:}
app.storage.s3.prefijo=${AWS_S3_PREFIJO:catalogo}
app.storage.imagenes.max-tamano=5MB
app.storage.imagenes.max-por-prenda=8
app.storage.imagenes.max-por-carga=10
# Debe cubrir max-por-carga x max-tamano
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=52MB
