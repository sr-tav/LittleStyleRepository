spring.datasource.url=jdbc:h2:mem:littlestyle-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Clave pública exclusiva para pruebas; nunca reutilizar en producción.
app.crypto.perfil-key=${PERFIL_ENC_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.perfiles.max=10
app.storage.tipo=local
app.storage.local.directorio=target/test-uploads
